[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# libximecore / libximep2p — shared crates (git dep, patched to local for development, 同 XimeChe 模式)
# 本地开发可自建 .cargo/config.toml（gitignored）patch 回 ../libximecore / ../libximep2p；
# 该文件不入库，CI/发布使用 git 依赖。本地 patch 会改 Cargo.lock 的 source，提交前 restore。
#
# xime-sync-domain 已从 libximecore 迁到 libximep2p（见 libximecore ea8e300），
# 必须与 libximecore 内部使用的 rev 完全一致：两边若指向不同 rev，会解析出两个
# xime-sync-domain，`Profile` 成为两个不同类型，跨 crate 传参会编译失败。
xime-sync-domain = { git = "https://github.com/ximeiorg/libximep2p.git", rev = "b19ecdec2c0336669897cafe909541906024dc29" }
# 三个同步服务 crate 钉在同一 rev 的 libximecore（该 rev 内部引用 libximep2p
# b19ecde，与下方 domain 一致）。不钉 rev 时，本地 patch 看邻居仓库 HEAD、
# CI 拉远端默认分支最新——两边可能解析到不同提交。
xime-sync-store = { git = "https://github.com/ximeiorg/libximecore.git", rev = "b4714f61ee17f9f8139acfc6ee0df34eca89ab00", package = "xime-sync-store" }
xime-sync-service = { git = "https://github.com/ximeiorg/libximecore.git", rev = "b4714f61ee17f9f8139acfc6ee0df34eca89ab00", package = "xime-sync-service" }
xime-sync-server = { git = "https://github.com/ximeiorg/libximecore.git", rev = "b4714f61ee17f9f8139acfc6ee0df34eca89ab00", package = "xime-sync-server" }
# 跨设备剪贴板 P2P（局域网直连，无第三方服务器）。与 domain 同仓同 rev：
# 它 re-export 的 `Profile` 必须和本仓用的是同一个类型（见上方 domain 注释）。
xime-p2p = { git = "https://github.com/ximeiorg/libximep2p.git", rev = "b19ecdec2c0336669897cafe909541906024dc29" }
client = { path = "crates/client" }
app = { path = "crates/app" }

# 低性能设备（树莓派）部署优化：体积/速度优先
[profile.release]
opt-level = "z"          # 最小体积
lto = true               # 跨 crate 链接时优化
codegen-units = 1        # 单单元提升优化机会
strip = true             # 剥离符号表
panic = "abort"          # 无 unwinding，减体积省内存
