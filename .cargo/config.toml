# Local development override — use local libximecore / libximep2p checkouts.
# Remove this file to use git dependencies (CI, release builds).
[patch."https://github.com/ximeiorg/libximecore"]
xime-sync-store = { path = "../libximecore/crates/xime-sync-store" }
xime-sync-service = { path = "../libximecore/crates/xime-sync-service" }
xime-sync-server = { path = "../libximecore/crates/xime-sync-server" }
# xime-plugin 不 patch：它钉在 mlua 时代的 rev（上游已迁 quickjs），
# 本地 HEAD 与那个 rev 的插件契约不同，patch 过来会让 client 编译失败。

# xime-sync-domain 已迁到 libximep2p（libximecore 经 git 依赖引用它），
# patch 必须打在 libximep2p 这个源上，否则 git 依赖仍会去拉远端。
[patch."https://github.com/ximeiorg/libximep2p"]
xime-sync-domain = { path = "../libximep2p/crates/xime-sync-domain" }
xime-p2p = { path = "../libximep2p/crates/xime-p2p" }
