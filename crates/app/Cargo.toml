[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
# Windows 下把 assets/icon.ico 嵌入 ximed-desktop/ximed-client 可执行文件资源
build = "build.rs"

[lib]
name = "app"
path = "src/lib.rs"

[[bin]]
name = "ximed-server"
path = "src/bin/ximed-server.rs"

[[bin]]
name = "ximed-desktop"
path = "src/bin/ximed-desktop.rs"
required-features = ["tray"]

[[bin]]
name = "ximed-client"
path = "src/bin/ximed-client.rs"

[features]
default = ["tray"]
# 托盘/窗口 UI（桌面形态）；server-only 构建可关掉以减小体积
tray = ["dep:tray-icon", "dep:muda", "dep:iced", "macos-dock-icon"]
# macOS 运行时设置 Dock 图标（cargo run 裸跑时 .icns 不生效，需运行时 setApplicationIconImage:）
macos-dock-icon = ["dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]

# cargo-packager 打包配置（CI nightly 生成 desktop 安装包）。
# version / out-dir / binaries-dir 等由 cargo-packager 从 cargo metadata 自动填充，
# 运行方式：cargo packager --release --target <triple> --formats <f>（见 .github/workflows/nightly.yml）
[package.metadata.packager]
product-name = "ximed"
identifier = "dev.ximed.desktop"
description = "ximed 输入法数据同步服务（桌面形态）"
homepage = ""
authors = ["ximed"]
category = "Utility"
license-file = "../../LICENSE"
icons = ["assets/icon.png", "assets/icon.ico", "assets/icon.icns"]
binaries = [{ path = "ximed-desktop", main = true }]

[package.metadata.packager.deb]
section = "utils"
priority = "optional"

[package.metadata.packager.nsis]
installer-icon = "assets/icon.ico"
languages = ["SimpChinese", "English"]
installer-mode = "currentUser"
appdata-paths = ["$LOCALAPPDATA/$IDENTIFIER"]

[dependencies]
server = { path = "../server" }
client = { path = "../client" }
domain = { path = "../domain" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 轻量 CLI 子命令解析
clap = { version = "4", features = ["derive"] }
# 随机密码生成（desktop 零配置启动）
getrandom = "0.3"
base64 = "0.22"
# 应用设置持久化（ximed-client.toml）
toml = "0.9"
# 桌面 UI（feature tray）：wgpu（GPU，Metal/Vulkan）优先，tiny-skia（CPU）自动兜底。
# 低性能设备（树莓派等）无 GPU 时自动回退软渲染，无需额外配置。
iced = { version = "0.14", optional = true, default-features = false, features = ["tokio", "wgpu", "tiny-skia", "x11", "wayland", "image"] }
# 托盘（feature tray）；Linux 需要 gtk 平台实现（muda/tray-icon 默认 feature 已关闭，需显式启用）
tray-icon = { version = "0.24", optional = true, default-features = false, features = ["gtk"] }
muda = { version = "0.19", optional = true, default-features = false, features = ["gtk"] }
# macOS 运行时设置 Dock 图标（cargo run 裸跑时 .icns 不生效，需运行时 setApplicationIconImage:）
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true }
objc2-foundation = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
embed-resource = "3.0"
