[package]
name = "service"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["history"]
history = ["store/history"]

[dependencies]
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
domain = { path = "../domain" }
store = { path = "../store" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
