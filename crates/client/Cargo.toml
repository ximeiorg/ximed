[package]
name = "client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
xime-sync-domain.workspace = true
xime-sync-store = { workspace = true, features = ["history"] }
# 局域网 P2P 传输（feature p2p）：局域网直连，无第三方服务器
xime-p2p = { workspace = true, optional = true }
tokio = { version = "1", features = ["time", "macros", "rt", "sync"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# 与 libximecore xime-sync-server 的 config 下限对齐（其 workspace 声明 ^0.15.27），
# 否则同一依赖图里两个下限无法统一到同一版本。
config = "0.15.27"
base64 = "0.22"
thiserror = "2"
# Wayland 会话下经 wlr-data-control 直连真实剪贴板；否则回退 X11/XWayland 通道，
# 在无剪贴板桥接（如 KDE 未运行 klipper）时读不到 Wayland 原生应用的复制内容
arboard = { version = "3", features = ["wayland-data-control"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time"] }

[features]
default = []
# 局域网直连通道（xime-p2p）：桌面形态自带的同步方式，无第三方服务器。
# 默认关：server 形态（树莓派等低性能设备）不引入 xime-p2p 的密码学依赖与网络栈。
p2p = ["dep:xime-p2p"]
