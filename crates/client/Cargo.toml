[package]
name = "client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
xime-sync-domain.workspace = true
xime-sync-store = { workspace = true, features = ["history"] }
xime-plugin = { workspace = true, optional = true }
tokio = { version = "1", features = ["time", "macros", "rt", "sync"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
config = "0.15"
base64 = "0.22"
thiserror = "2"
# Wayland 会话下经 wlr-data-control 直连真实剪贴板；否则回退 X11/XWayland 通道，
# 在无剪贴板桥接（如 KDE 未运行 klipper）时读不到 Wayland 原生应用的复制内容
arboard = { version = "3", features = ["wayland-data-control"] }
tracing = "0.1"
# 同步插件框架（feature plugin）：商店索引 sha256 校验 + configSchema 解析
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
serde_yaml = { version = "0.9", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time"] }
# 测试打包 .xipk fixture（与 xime-plugin 同版本，避免重复编译）
zip = "8.6"

[features]
default = []
# Lua clipboard_sync 插件框架（引入 mlua；仅插件同步需要时开启，server 形态保持最小体积）
plugin = ["dep:xime-plugin", "dep:serde_yaml", "dep:sha2", "dep:hex"]
