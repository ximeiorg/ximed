[package]
name = "domain"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["fs", "sync", "rt", "macros"] }
