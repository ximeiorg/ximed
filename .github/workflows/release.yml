# ximed release 构建：推送 v* 或数字 tag（如 0.2.0）时构建三平台桌面安装包并发布 GitHub Release。
#
# 实际构建矩阵见 build-packages.yml（可复用工作流）。
# 产物：ximed-desktop-<target>.<格式>（Windows NSIS/zip、Linux deb/rpm/AppImage、macOS dmg）
name: release

on:
  push:
    tags:
      - "v*"
      - "0.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-packages.yml
    with:
      publish: tag
      include-date: false
