# 可复用构建工作流：Windows / Linux / macOS 主流架构，出 server 与 desktop 两种包。
#
# 两种包：
#   - server  包：ximed-server（--no-default-features，无 UI，最小体积，低性能设备/RPi）
#   - desktop 包：ximed-desktop（默认构建，同进程 server + client + 托盘，iced 桌面 UI）
#       Windows：NSIS 安装器 setup.exe + 便携版 zip
#       Linux：  .deb + .AppImage
#       macOS：  .dmg（内部含 .app）
#
# 桌面包格式由 cargo-packager（Tauri 同源）生成，配置见 crates/app/Cargo.toml
# 的 [package.metadata.packager]。
#
# 由调用方触发：
#   - nightly.yml  每日 02:00 UTC / 手动（publish=nightly：产物更新到滚动 nightly release）
#   - release.yml  推送 v* tag（publish=tag：发布到当前 tag 的 GitHub Release）
name: build-packages

on:
  workflow_call:
    inputs:
      publish:
        description: "发布方式：none=仅上传 Actions artifacts；tag=发布到当前 tag 的 GitHub Release；nightly=更新滚动 nightly release"
        required: false
        type: string
        default: "none"
      include-date:
        description: "产物文件名追加构建日期（nightly 用，如 ximed-server-<target>-2026-08-06.zip）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            packages: "server desktop"
            cache: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            packages: "server desktop"
            apt: true
            cache: true
          # Linux ARM：musl 静态链接，仅 server（桌面 UI 在 ARM musl 上不可构建）
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            packages: "server"
            cross: true
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            packages: "server"
            cross: true
          - os: macos-14
            target: aarch64-apple-darwin
            packages: "server desktop"
            cache: true
          - os: macos-14
            target: x86_64-apple-darwin
            packages: "server desktop"
            cache: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux desktop build dependencies
        if: matrix.apt
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config file desktop-file-utils \
            libx11-dev libxi-dev libxrandr-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-cursor-dev \
            libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev

      - name: Install cross
        if: matrix.cross
        uses: cross-rs/cross@v0.2.5

      - name: Cache cargo
        if: matrix.cache
        uses: Swatinem/rust-cache@v2

      - name: Build packages
        shell: bash
        env:
          TOOL: ${{ matrix.cross && 'cross' || 'cargo' }}
          TARGET: ${{ matrix.target }}
          PACKAGES: ${{ matrix.packages }}
        run: |
          set -euo pipefail
          for pkg in $PACKAGES; do
            case "$pkg" in
              server)
                $TOOL build --release --locked --target "$TARGET" --no-default-features --bin ximed-server
                ;;
              desktop)
                $TOOL build --release --locked --target "$TARGET" --bin ximed-desktop
                ;;
            esac
          done

      - name: Install cargo-packager
        if: contains(matrix.packages, 'desktop')
        run: cargo install cargo-packager --locked

      - name: Package archives
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PACKAGES: ${{ matrix.packages }}
          RUNNER_OS: ${{ runner.os }}
          INCLUDE_DATE: ${{ inputs.include-date }}
        run: |
          set -euo pipefail
          mkdir -p dist
          DATE_SUFFIX=""
          if [ "$INCLUDE_DATE" = "true" ]; then
            DATE_SUFFIX="-$(date -u +%Y-%m-%d)"
          fi
          for pkg in $PACKAGES; do
            case "$pkg" in
              server)
                # 裸二进制归档（无 UI，低性能设备直接部署）
                bin="ximed-server"
                [ "$RUNNER_OS" = "Windows" ] && bin="${bin}.exe"
                stage="stage/server"
                rm -rf "$stage"
                mkdir -p "$stage"
                cp "target/${TARGET}/release/${bin}" "$stage/"
                cp LICENSE "$stage/"
                cp deploy/ximed.service "$stage/"
                if [ "$RUNNER_OS" = "Windows" ]; then
                  powershell -NoProfile -Command \
                    "Compress-Archive -Path 'stage/server/*' -DestinationPath 'dist/ximed-server-${TARGET}${DATE_SUFFIX}.zip' -Force"
                else
                  tar -czf "dist/ximed-server-${TARGET}${DATE_SUFFIX}.tar.gz" -C "$stage" .
                fi
                ;;
              desktop)
                # cargo-packager 生成桌面包格式（配置见 crates/app/Cargo.toml）
                case "$RUNNER_OS" in
                  Linux)   FORMATS="deb,appimage" ;;
                  macOS)   FORMATS="app,dmg" ;;
                  Windows) FORMATS="nsis" ;;
                esac
                cargo packager --release --target "$TARGET" --formats "$FORMATS" \
                  --out-dir "$GITHUB_WORKSPACE/dist"
                case "$RUNNER_OS" in
                  Linux)
                    mv dist/*.deb "dist/ximed-desktop-${TARGET}${DATE_SUFFIX}.deb"
                    mv dist/*.AppImage "dist/ximed-desktop-${TARGET}${DATE_SUFFIX}.AppImage"
                    ;;
                  macOS)
                    mv dist/*.dmg "dist/ximed-desktop-${TARGET}${DATE_SUFFIX}.dmg"
                    rm -rf dist/*.app
                    ;;
                  Windows)
                    mv dist/*-setup.exe "dist/ximed-desktop-${TARGET}${DATE_SUFFIX}-setup.exe"
                    powershell -NoProfile -Command \
                      "Compress-Archive -Path 'target/${TARGET}/release/ximed-desktop.exe','LICENSE' -DestinationPath 'dist/ximed-desktop-${TARGET}${DATE_SUFFIX}-portable.zip' -Force"
                    ;;
                esac
                ;;
            esac
          done
          # 清理 cargo-packager 工具集缓存（默认落在 out-dir）
          rm -rf dist/.cargo-packager

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ximed-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: inputs.publish == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true

  # 滚动 nightly release：nightly 构建专用。每次运行删除旧 release 并重建，
  # 始终只有一个 nightly release，包含最新构建的全部包。
  publish-nightly:
    name: Publish rolling nightly release
    needs: build
    if: inputs.publish == 'nightly'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist

      - name: Delete previous nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true

      - name: Create rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create nightly "dist/*" \
            --title "ximed nightly $(date -u +%Y-%m-%d)" \
            --prerelease \
            --notes "自动 nightly 构建，滚动更新（文件名含构建日期）。"
