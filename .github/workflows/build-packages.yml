# 可复用构建工作流：Windows / Linux / macOS 桌面包。
#
# 当前只构建桌面形态（ximed-desktop），不构建 server / client：
#   Windows：NSIS 安装器 setup.exe + 便携版 zip
#   Linux：  .deb + .rpm + .AppImage
#   macOS：  .dmg（内部含 .app），同时出 arm64 / x86_64 两个 target
#
# 桌面包格式：deb/AppImage/NSIS/dmg 由 cargo-packager 生成，配置见
# crates/app/Cargo.toml 的 [package.metadata.packager]；rpm 由 cargo-generate-rpm
# 生成，配置见同文件的 [package.metadata.generate-rpm]。
#
# 由调用方触发：
#   - nightly.yml  每日 02:00 UTC / 手动（publish=nightly：产物更新到滚动 nightly release）
#   - release.yml  推送 v* tag（publish=tag：发布到当前 tag 的 GitHub Release）
name: build-packages

on:
  workflow_call:
    inputs:
      publish:
        description: "发布方式：none=仅上传 Actions artifacts；tag=发布到当前 tag 的 GitHub Release；nightly=更新滚动 nightly release"
        required: false
        type: string
        default: "none"
      include-date:
        description: "产物文件名追加构建日期（nightly 用，如 ximed-desktop-<target>-2026-08-06.deb）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cache: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            apt: true
            cache: true
          - os: macos-14
            target: aarch64-apple-darwin
            cache: true
          - os: macos-14
            target: x86_64-apple-darwin
            cache: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux desktop build dependencies
        if: matrix.apt
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config file desktop-file-utils \
            libx11-dev libxi-dev libxrandr-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-cursor-dev \
            libxkbcommon-dev libwayland-dev libgtk-3-dev libayatana-appindicator3-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev

      - name: Cache cargo
        if: matrix.cache
        uses: Swatinem/rust-cache@v2

      - name: Build desktop
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --locked --bin ximed-desktop

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Install cargo-generate-rpm (Linux rpm packaging)
        if: matrix.apt
        run: cargo install cargo-generate-rpm --version 0.21.1 --locked

      - name: Package desktop
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RUNNER_OS: ${{ runner.os }}
          INCLUDE_DATE: ${{ inputs.include-date }}
        run: |
          set -euo pipefail
          mkdir -p dist
          DATE_SUFFIX=""
          if [ "$INCLUDE_DATE" = "true" ]; then
            DATE_SUFFIX="-$(date -u +%Y-%m-%d)"
          fi

          case "$RUNNER_OS" in
            Linux)
              cargo packager --release --target "$TARGET" --formats deb,appimage \
                --out-dir "$GITHUB_WORKSPACE/dist"
              mv dist/*.deb "dist/ximed-desktop-${TARGET}${DATE_SUFFIX}.deb"
              mv dist/*.AppImage "dist/ximed-desktop-${TARGET}${DATE_SUFFIX}.AppImage"

              cargo generate-rpm -p crates/app --target "$TARGET" \
                --output "dist/ximed-desktop-${TARGET}${DATE_SUFFIX}.rpm"
              test -f "dist/ximed-desktop-${TARGET}${DATE_SUFFIX}.rpm"
              ;;
            macOS)
              cargo packager --release --target "$TARGET" --formats app,dmg \
                --out-dir "$GITHUB_WORKSPACE/dist"
              mv dist/*.dmg "dist/ximed-desktop-${TARGET}${DATE_SUFFIX}.dmg"
              rm -rf dist/*.app
              ;;
            Windows)
              cargo packager --release --target "$TARGET" --formats nsis \
                --out-dir "$GITHUB_WORKSPACE/dist"
              mv dist/*-setup.exe "dist/ximed-desktop-${TARGET}${DATE_SUFFIX}-setup.exe"
              powershell -NoProfile -Command \
                "Compress-Archive -Path 'target/${TARGET}/release/ximed-desktop.exe','LICENSE' -DestinationPath 'dist/ximed-desktop-${TARGET}${DATE_SUFFIX}-portable.zip' -Force"
              ;;
          esac

          # 清理 cargo-packager 工具集缓存（默认落在 out-dir）
          rm -rf dist/.cargo-packager

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ximed-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: inputs.publish == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true

  # 滚动 nightly release：nightly 构建专用。每次运行删除旧 release 并重建，
  # 始终只有一个 nightly release，包含最新构建的全部包。
  publish-nightly:
    name: Publish rolling nightly release
    needs: build
    if: inputs.publish == 'nightly'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist

      - name: Delete previous nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true

      - name: Create rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create nightly "dist/*" \
            --title "ximed nightly $(date -u +%Y-%m-%d)" \
            --prerelease \
            --notes "自动 nightly 构建，滚动更新（文件名含构建日期）。"
