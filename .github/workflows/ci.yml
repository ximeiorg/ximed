# ximed 每次 push / PR 的代码检查：fmt + clippy（默认与无 UI 精简构建）+ 全量测试（三平台）。
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # .cargo/config.toml 是本地开发用的 patch（指向 ../libximecore / ../libximep2p），
      # 已在 .gitignore 里；但历史上被跟踪过，一旦再次提交，CI 上这些兄弟目录不存在，
      # 报错是「patch location does not contain packages」，与真实原因差得很远。
      - name: Guard against committed local cargo patch
        run: |
          if [ -f .cargo/config.toml ]; then
            echo "::error::.cargo/config.toml must not be committed: it patches ../libximecore and ../libximep2p, which do not exist on CI. Run 'git rm --cached .cargo/config.toml'."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Format check
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libx11-dev libxi-dev libxrandr-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-cursor-dev \
            libxkbcommon-dev libwayland-dev libgtk-3-dev libayatana-appindicator3-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev
      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy (no default features, minimal server/client build)
        run: cargo clippy -p app --no-default-features --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libx11-dev libxi-dev libxrandr-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-cursor-dev \
            libxkbcommon-dev libwayland-dev libgtk-3-dev libayatana-appindicator3-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev
      - name: Test (default features)
        run: cargo test --workspace --all-targets --locked
      - name: Check no-default-features (minimal server/client build)
        run: cargo check -p app --no-default-features --locked
