# ximed nightly 构建：每日构建三平台桌面安装包，产物文件名带构建日期，
# 并更新到滚动的 nightly GitHub Release（不新建版本 release）。
#
# 实际构建矩阵见 build-packages.yml（可复用工作流）。
name: nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-packages.yml
    with:
      publish: nightly
      include-date: true
